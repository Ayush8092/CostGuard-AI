# CostGuard AI - top-level reverse proxy (Part 8 requirement).
# This is the single entry point for the whole stack: routes /api/* to
# the FastAPI backend container and everything else to the frontend
# (static SPA) container. In production this is the only port exposed
# to the outside world.
server {
    listen 80;
    server_name _;

    client_max_body_size 50M;  # allow reasonably large CSV uploads (Tier 3)

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;  # LLM calls can take a few seconds
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
