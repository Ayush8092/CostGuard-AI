# CostGuard AI - Docker Compose orchestration (Part 8).
#
# One command brings up the entire stack:
#   docker compose up
#
# This configuration uses HOSTED free-tier Postgres (Neon) and Redis
# (Upstash) instead of local containers - set DATABASE_URL_OVERRIDE and
# REDIS_URL_OVERRIDE in .env to your Neon/Upstash connection strings.
# Both providers have genuinely free, non-expiring tiers (verify current
# terms before committing, since provider policies change - see Part 11).
#
# FAISS has no separate container; it runs embedded inside the backend
# process and persists its index to the faiss_index_data volume.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - upload_data:/app/data/uploads
      - faiss_index_data:/app/data/faiss_index
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"

volumes:
  upload_data:
  faiss_index_data: